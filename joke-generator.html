<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <link rel="stylesheet" href="joke-style.css">
</head>
<body>
    <div class="container">
        <div class="joke-card">
            <h1>😂 Joke Generator</h1>
            
            <div class="joke-display">
                <div id="joke-text" class="joke-text">Click the button to get a random joke!</div>
            </div>
            
            <div class="controls">
                <button id="generate-btn" class="btn btn-primary">Get Joke</button>
                <button id="copy-btn" class="btn btn-secondary" title="Copy joke to clipboard">📋 Copy</button>
            </div>
            
            <div class="joke-type-selector">
                <label for="joke-type">Joke Type:</label>
                <select id="joke-type">
                    <option value="any">Any</option>
                    <option value="general">General</option>
                    <option value="knock-knock">Knock-Knock</option>
                    <option value="programming">Programming</option>
                </select>
            </div>
            
            <div class="loading" id="loading">Loading...</div>
            
            <div class="error" id="error-message"></div>
            
            <div class="stats">
                <p>Jokes Generated: <span id="joke-count">0</span></p>
            </div>
        </div>
    </div>

    <script src="joke-script.js"></script>
</body>
</html>
