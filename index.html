<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock - Multiple Time Zones</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>World Clock</h1>
        <div class="clocks-grid">
            <div class="clock-card">
                <h2>New York (EST)</h2>
                <div class="time" id="ny-time">00:00:00</div>
                <div class="timezone">UTC-5</div>
            </div>
            <div class="clock-card">
                <h2>London (GMT)</h2>
                <div class="time" id="london-time">00:00:00</div>
                <div class="timezone">UTC+0</div>
            </div>
            <div class="clock-card">
                <h2>Paris (CET)</h2>
                <div class="time" id="paris-time">00:00:00</div>
                <div class="timezone">UTC+1</div>
            </div>
            <div class="clock-card">
                <h2>Dubai (GST)</h2>
                <div class="time" id="dubai-time">00:00:00</div>
                <div class="timezone">UTC+4</div>
            </div>
            <div class="clock-card">
                <h2>India (IST)</h2>
                <div class="time" id="india-time">00:00:00</div>
                <div class="timezone">UTC+5:30</div>
            </div>
            <div class="clock-card">
                <h2>Tokyo (JST)</h2>
                <div class="time" id="tokyo-time">00:00:00</div>
                <div class="timezone">UTC+9</div>
            </div>
            <div class="clock-card">
                <h2>Sydney (AEDT)</h2>
                <div class="time" id="sydney-time">00:00:00</div>
                <div class="timezone">UTC+11</div>
            </div>
            <div class="clock-card">
                <h2>Los Angeles (PST)</h2>
                <div class="time" id="la-time">00:00:00</div>
                <div class="timezone">UTC-8</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
